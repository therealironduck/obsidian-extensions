name: Release

# Manually triggered. Derives the next version from Conventional Commits since
# the last tag, bumps the Obsidian manifest, builds, tags and publishes.
#
# The tag is the bare version with no `v` prefix: Obsidian's community catalog
# requires that, and BRAT resolves releases the same way.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Bump level (auto = derive from Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  # Never interrupt a run that may already have tagged and pushed.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch can be fired from any ref; releasing a feature branch
      # would tag a commit that is not on main.
      - name: Guard - release only from main
        run: test "${{ github.ref }}" = refs/heads/main

      # `main` requires pull requests, and GITHUB_TOKEN cannot bypass that: the
      # built-in GitHub Actions app is first-party and is not installable as an
      # org integration, so it cannot be a ruleset bypass actor. A dedicated
      # org-owned App can be, so the bump commit is pushed with its token.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # `app-id` is deprecated in favour of `client-id`.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Full history and tags: the bump tool measures commits since the
          # most recent tag.
          fetch-depth: 0
          # Persist the App token as the remote credential so the later push
          # carries the bypass.
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads the `packageManager` field so the version is pinned in one place.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # Deliberately before any mutation. The bundle does not embed the version
      # (static banner, no `define` in esbuild.config.mjs), so building first is
      # free and means a broken build fails before anything is bumped or tagged.
      - name: Verify and build
        run: |
          set -euo pipefail
          bun run format:check
          bun run lint
          bun run build
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Determine release type
        id: bump
        run: |
          set -euo pipefail
          if [ "${{ inputs.release_type }}" != auto ]; then
            LEVEL="${{ inputs.release_type }}"
          else
            # Called by path rather than through a runner, so it can only ever
            # be the version pinned in the lockfile.
            LEVEL="$(./node_modules/.bin/conventional-recommended-bump -p conventionalcommits)"
          fi
          # The preset prints nothing when every commit since the last tag is a
          # hidden type (chore, docs, ci, refactor, style, test, build).
          if [ -z "$LEVEL" ]; then
            echo "::error::No releasable commits since the last tag. Re-run with an explicit release_type to force one."
            exit 1
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      # One bump. `bun pm version` runs the `version` lifecycle script even with
      # --no-git-tag-version, so version-bump.mjs syncs manifest.json and
      # versions.json with the correct npm_package_version. Do not also invoke
      # version-bump.mjs by hand: with an empty variable it writes an undefined
      # version and a literal "undefined" key into versions.json.
      - name: Bump version
        id: v
        run: |
          set -euo pipefail
          bun pm version "${{ steps.bump.outputs.level }}" --no-git-tag-version
          # Read from package.json, not from stdout, which carries a `v` prefix.
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Assert version consistency
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.version }}'
          test "$(node -p "require('./manifest.json').version")" = "$V"
          node -e 'const v=process.argv[1];const m=require("./manifest.json");if(require("./versions.json")[v]!==m.minAppVersion)throw new Error("versions.json missing "+v)' "$V"
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "::error::tag $V already exists"
            exit 1
          fi

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.version }}'
          SLUG='${{ steps.app-token.outputs.app-slug }}'
          # Resolve the bot's numeric id so the commit is properly attributed to
          # the App. Cosmetic only, so a lookup failure must not fail the
          # release - fall back to the unlinked address.
          git config user.name "${SLUG}[bot]"
          if BOT_ID="$(gh api "/users/${SLUG}[bot]" --jq .id 2>/dev/null)" && [ -n "$BOT_ID" ]; then
            git config user.email "${BOT_ID}+${SLUG}[bot]@users.noreply.github.com"
          else
            git config user.email "${SLUG}[bot]@users.noreply.github.com"
          fi
          # The `version` script only stages manifest.json and versions.json.
          # bun.lock does not currently carry the workspace version, but it is
          # staged anyway so a future bun that does cannot drift.
          git add package.json bun.lock manifest.json versions.json
          git commit -m "chore(release): $V"
          git tag -a "$V" -m "$V"
          # Works against a PR-protected main only because the ruleset grants
          # this App bypass. See AGENTS.md.
          git push origin HEAD:main
          git push origin "refs/tags/$V"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.v.outputs.version }}
          name: ${{ steps.v.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          # A release missing an asset installs as a broken plugin.
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
