name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check context referenced by the `main` ruleset.
  # Renaming it silently detaches the required check — update the ruleset too.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads the `packageManager` field so the version is pinned in one place.
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      # Warnings do not fail the build; see AGENTS.md on the two deliberately
      # ignored sentence-case warnings.
      - name: Lint
        run: bun run lint

      # `build` runs `tsc -noEmit` first, so this is the typecheck as well.
      - name: Build
        run: bun run build
