name: PR title

# Merges are squash-merges and the repo is configured to use the PR title as
# the squash subject, so validating the title here is what keeps the commit
# history on `main` parseable by the release workflow's version detection.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional-commit:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
